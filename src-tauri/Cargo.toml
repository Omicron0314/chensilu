[package]
name = "chensilu"
version = "0.1.0"
description = "沉思路 · AI 日记助手"
authors = ["omicron0314 <omicron0314@gmail.com>"]
edition = "2021"

[lib]
name = "chensilu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
